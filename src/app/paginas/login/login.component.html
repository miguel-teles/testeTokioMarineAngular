<div class="d-flex flex-column p-2 justify-content-center text-center" style="margin-top:200px">
  <h1>Login</h1>
  <p>Selecione uma Conta para começar</p>
  <div class="d-flex justify-content-center mb-3">
    <div class="dropdown" style="width: 220px">
      <button class="btn border-black border-1 dropdown-toggle w-100" type="button" id="dropdownMenuButton"
              data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        @if (contaSelecionada()) {
          {{ contaSelecionada()?.id }} - {{ contaSelecionada()?.nome }}
        } @else {
          Selecione uma conta aqui
        }
      </button>
      <div class="dropdown-menu w-100" aria-labelledby="dropdownMenuButton">
        @for (conta of contas(); track conta.id) {
          <a class="dropdown-item" (click)="selecionarConta(conta)">{{ conta.id }} - {{ conta.nome }}</a>
        }
      </div>
    </div>
  </div>
  <div class="d-flex justify-content-center">
    <button class="btn btn-primary">Entrar</button>
  </div>
</div>
