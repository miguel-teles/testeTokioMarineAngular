<div class="d-flex flex-column p-2 justify-content-center container" style="margin-top:200px; width: 300px">
  <h1 class="text-center">Logar</h1>
  <small class="text-muted text-center mb-3">Login e senha encontram-se no readme.</small>
  @if (this.error()) {
    <div class="alert alert-danger" role="alert">
      {{ this.error() }}
    </div>
  }
  <div class="border p-3 rounded">
    <form [formGroup]="loginFormGroup" #formComponent="ngForm">
      <div class="form-group">
        <label for="login">Login</label>
        <input type="text"
               class="form-control"
               id="login"
               [formControl]="loginFormGroup.controls.login"
               placeholder="Digite o login">
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password"
               class="form-control"
               id="senha"
               [formControl]="loginFormGroup.controls.senha"
               placeholder="Digite a senha (é 1234)">
      </div>
      <button class="btn btn-primary w-100"
              [disabled]="!formComponent.form.valid"
              (click)="entrar()">Entrar</button>
    </form>
  </div>
</div>
